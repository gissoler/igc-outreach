# IGC Outreach. setup.sh reemplaza DOMINIO y certbot agrega el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    root /opt/outreach/frontend/dist;
    index index.html;

    # Contactos CSV, calendarios .ics y documentos del setup.
    client_max_body_size 25m;

    # Research: cuentas, red, LinkedIn, agentes. Algunas llamadas tardan hasta 3 min
    # y las corridas en vivo transmiten eventos, así que sin buffer y con timeouts largos.
    location /api/research/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API warmpath (dashboard, config, ranking).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (/buscar, /setup…) carga index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
