# Tipo MIME de .mjs. Las versiones de nginx de Ubuntu lo sirven como octet-stream y el navegador
# rechaza el worker del lector de PDF (pdf.worker.min-*.mjs: "Failed to fetch dynamically imported module").
# Va en conf.d (contexto http) para no depender de lo que certbot haya cambiado en el sitio.
types {
    text/javascript mjs;
}
